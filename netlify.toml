# NOW-Webseite, live auf now-consulting.at (Projekt now-consulting, Zweig
# main, seit 14.11.2026). Live ist die helle Fassung B: Netlify baut sie
# aus index.html mit werkzeuge/variante.py (nur Python-Standardbibliothek,
# keine Abhaengigkeiten) nach _ausgabe/hell und liefert diesen Ordner aus.
# Der Befehl ueberschreibt den alten Build aus dem Netlify-UI ("npm run
# build" der Vite-Seite). Schlaegt der Bau fehl, bleibt die letzte Fassung
# online.
# variante.py schreibt in _ausgabe/hell eine eigene netlify.toml ohne
# Bau-Schritt, damit die Vorschau (now-consulting-hell) weiter direkt aus
# dem Ordner ausgeliefert werden kann.
[build]
  command = "python3 werkzeuge/variante.py hell"
  publish = "_ausgabe/hell"

# Arbeitsdateien sind nicht oeffentlich. Netlify kann nur Pfade am Ende
# platzhaltern, keine Dateiendungen: "/*.md" greift nie, jede Datei
# einzeln nennen.
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/qa/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/notizen/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/werkzeuge/*"
  to = "/404.html"
  status = 404
  force = true

# Alte Adresse der Vite-Seite
[[redirects]]
  from = "/vorschau/*"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Schriften aendern sich nicht mehr, wenn sie einmal stehen. Neue Fassung
# nur ueber fonts.css?v=N.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/bilder/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
